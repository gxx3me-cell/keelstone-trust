# All five functions verify the caller themselves via the Authorization header
# (see functions/_shared/auth.ts), so JWT verification stays ON. Turning it off
# would let anyone on the internet POST to these endpoints.
[functions.submit-deposit]
verify_jwt = true

[functions.admin-action]
verify_jwt = true

[functions.send-welcome-email]
verify_jwt = true

[functions.support-email]
verify_jwt = true

[functions.admin-fund]
verify_jwt = true
